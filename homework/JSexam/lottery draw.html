<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Lottery draw</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
 

</head>
<body>
	<h3>LOTTERY DRAW</h3><br>
	<button onclick="lotteryDraw()">Click to know the winner</button><br><br>
	<p id="demo1">The winner is :</p>
	<p id="demo2" ></p>

		
<div class="modal fade" id="winnerModal" tabindex="-1">
	  <div class="modal-dialog">
	    <div class="modal-content">
	      <div class="modal-header">
	        <h5 class="modal-title">Lottery Winner</h5>
	        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
	      </div>
	      <div class="modal-body">
	        <p id="modalWinner"></p>
	      </div>
	    </div>
	  </div>
	</div>
<script>

	
let tickets=[10,11,12,13,14,15];
let randomNumber=tickets.length;
 function lotteryDraw() 
 {
 	let i= Math.floor(Math.random()*randomNumber)
 	let winner=tickets[i];
 	document.getElementById('demo2').innerHTML=`${winner}`
 	console.log(`The winner is ${winner}`)

 document.getElementById('demo2').style.color="red"

document.getElementById('modalWinner').innerHTML =
		`The winner is ${winner}`;

	let modal = new bootstrap.Modal(
		document.getElementById('winnerModal')
	);
	modal.show();

 }


</script>
</body>
</html>
